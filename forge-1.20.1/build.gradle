plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = "${rootProject.mod_version}-${project.minecraft_version}-forge"
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-forge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${rootProject.mod_id}" { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${rootProject.mod_id}" { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${rootProject.mod_id}.refmap.json"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"

    // TODO: pin to the AE2 artifact/version compatible with Minecraft 1.20.1 / Forge
    // implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
