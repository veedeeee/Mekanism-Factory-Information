plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.134'
}

version = "${rootProject.mod_version}-${project.minecraft_version}-neoforge"
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-neoforge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = project.neoforge_version

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { client() }
        server { server() }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // TODO: pin to the Mekanism artifact/version compatible with Minecraft 26.1.2
    // compileOnly "mekanism:Mekanism:${mekanism_version}"

    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
