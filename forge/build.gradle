plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

def forgeMinecraftVersion = '1.20.1'
def forgeVersion = '47.4.10'
def forgeLoaderVersionRange = '[47,)'
def forgeMinecraftVersionRange = '[1.20.1, 1.21)'

ext.minecraft_version = forgeMinecraftVersion
ext.minecraft_version_range = forgeMinecraftVersionRange
ext.forge_version = forgeVersion
ext.forge_loader_version_range = forgeLoaderVersionRange

repositories {
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
        content {
            includeGroup "appeng"
            includeGroup "org.appliedenergistics"
            includeGroup "mezz.jei"
            includeGroup "mekanism"
        }
    }
    maven {
        name = "Cursemaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = "${archives_name}-forge-${forgeMinecraftVersion}"
}

mixin {
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

minecraft {
    mappings channel: 'official', version: forgeMinecraftVersion

    copyIdeResources = true //Calls processResources when in dev

    reobf = true // Forge 1.20.1 runtime expects SRG-style names for many Forge mods

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${forgeMinecraftVersion}-${forgeVersion}"
    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    compileOnly "maven.modrinth:ae2:7KVs6HMQ"
    runtimeOnly "maven.modrinth:ae2:7KVs6HMQ"
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.0.0.12")
    compileOnly fg.deobf("curse.maven:jade-324717:4573193")
    runtimeOnly fg.deobf("curse.maven:jade-324717:4573193")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:20.1.7")
    // Mekanism is a required dependency.
    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version_forge}")
    runtimeOnly fg.deobf("mekanism:Mekanism:${mekanism_version_forge}")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

tasks.named('sourcesJar', Jar) {
    // Forge-specific CableSpecHelper/TankSpecHelper replace the common versions.
    // Keep the first occurrence (forge-local) and discard the common duplicate.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileJava', JavaCompile) {
    // Exclude CableSpecHelper and TankSpecHelper from common sources; Forge 1.20.1 provides
    // its own versions under forge/src/main/java with the same package (FloatingLong-aware).
    doFirst {
        setSource(getSource().matching {
            exclude { e ->
                def filePath = e.file.absolutePath.replace('\\' as char, '/' as char)
                def isFromCommon = filePath.contains('/common/src/')
                def isVersionSpecificHelper = e.name == 'CableSpecHelper.java' || e.name == 'TankSpecHelper.java'
                isFromCommon && isVersionSpecificHelper
            }
        })
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
