buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.43-beta'
}

version = "${rootProject.mod_version}-${project.minecraft_version}-neoforge"
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-neoforge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = project.neo_version
    accessTransformers = project.files("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"

    // TODO: pin to the AE2 artifact/version compatible with Minecraft 1.21.1
    // implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
